# Dependency manifest for the provided workshop data app.
#
# Databricks Apps installs with **uv** when the app directory has a
# `pyproject.toml` + `uv.lock` and NO `requirements.txt` (a `requirements.txt`
# always forces the pip path). See:
# https://docs.databricks.com/aws/en/dev-tools/databricks-apps/dependencies/
#
# The uv path ships NO pre-installed libraries, so every runtime dependency is
# declared here, including streamlit and pandas (which the pip runtime would
# otherwise pre-install). Regenerate the lock after editing: `cd app && uv lock`.
[project]
name = "stryker-workshop-app"
version = "0.1.0"
description = "The provided Stryker workshop data app (Streamlit): Genie agent + Lakebase synced serving table."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38,<2",
    "pandas>=2.2,<3",
    "databricks-sdk>=0.81,<1",
    "psycopg[binary]>=3.2,<4",
]

# The app is run (`streamlit run app.py`), never built or imported as a package,
# so keep uv from trying to build a wheel for it.
[tool.uv]
package = false

# Workshop PyPI proxy workaround.
#
# The transitive chain databricks-sdk -> google-auth -> pyasn1-modules pulls in
# pyasn1. Left unbounded, uv resolves pyasn1 to the newly released 0.6.4, and
# the workspace proxy (pypi-proxy.cloud.databricks.com) cannot serve that wheel
# on the Apps build path (the download connect-times-out after 3 retries),
# which fails `[ERROR] Error installing packages` at deploy time.
#
# Pin pyasn1 to the mature 0.6.1, which the proxy has long served and cached.
# pyasn1-modules 0.4.2 requires pyasn1>=0.6.1,<0.7.0, so 0.6.1 satisfies the
# chain. This is a constraint, not a project dependency, so the app does not
# gain pyasn1 as a direct import; it only bounds the transitive resolution.
constraint-dependencies = ["pyasn1==0.6.1"]
