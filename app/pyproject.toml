# Dependency manifest for the provided workshop data app.
#
# Databricks Apps installs with **uv** when the app directory has a
# `pyproject.toml` + `uv.lock` and NO `requirements.txt` (a `requirements.txt`
# always forces the pip path). See:
# https://docs.databricks.com/aws/en/dev-tools/databricks-apps/dependencies/
#
# The uv path ships NO pre-installed libraries, so every runtime dependency is
# declared here, including streamlit and pandas (which the pip runtime would
# otherwise pre-install). Regenerate the lock after editing: `cd app && uv lock`.
[project]
name = "stryker-workshop-app"
version = "0.1.0"
description = "The provided Stryker workshop data app (Streamlit): Genie agent + Lakebase synced serving table."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38,<2",
    "pandas>=2.2,<3",
    "databricks-sdk>=0.81,<1",
    "psycopg[binary]>=3.2,<4",
]

# The app is run (`streamlit run app.py`), never built or imported as a package,
# so keep uv from trying to build a wheel for it.
[tool.uv]
package = false

# Workshop PyPI proxy workaround.
#
# The app installs on the Databricks Apps uv path. The workspace proxy
# (pypi-proxy.cloud.databricks.com) serves mature, already-cached wheels fast
# but connect-times-out on recently released wheels of rarely pulled packages:
# a cache miss triggers a slow upstream fetch that times out after 3 retries,
# failing package install with `[ERROR] Error installing packages`.
#
# The offenders are the niche auth sub-chain that databricks-sdk pulls in for
# GCP support (databricks-sdk requires `google-auth~=2.0`), which this Azure
# workshop never exercises. Left unbounded, uv resolves that sub-chain to its
# newest, uncached releases:
#   * pyasn1 0.6.4       (released 2026-07)
#   * google-auth 2.58.0 (released 2026-09)
# Both connect-time-out on the Apps build path.
#
# Pin the sub-chain to mature versions the proxy has long served and cached,
# staying inside databricks-sdk 0.141.0's allowed ranges:
#   * pyasn1 0.6.1       (2024-09); pyasn1-modules 0.4.2 needs pyasn1>=0.6.1,<0.7.0.
#   * google-auth 2.38.0 (2025-02); satisfies databricks-sdk's google-auth~=2.0.
#
# Downgrading google-auth also drops the recent, heavy `cryptography` (only
# google-auth 2.58.0 pulls it as a core dep) and re-adds the ancient rsa 4.9,
# so the whole resolved closure is versions the proxy already serves. These are
# constraints, not project dependencies, so the app gains no new direct import;
# they only bound the transitive resolution. streamlit, pandas, databricks-sdk,
# and psycopg[binary] still resolve and import.
constraint-dependencies = [
    "pyasn1==0.6.1",
    "google-auth==2.38.0",
]
