<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workshop data app</title>
  <style>
    :root { color-scheme: light dark; --gap: 16px; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           margin: 0; padding: var(--gap); line-height: 1.5; }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    p.sub { margin: 0 0 var(--gap); opacity: 0.7; }
    section { border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
              border-radius: 10px; padding: var(--gap); margin-bottom: var(--gap); }
    h2 { font-size: 1rem; margin: 0 0 8px; }
    button { padding: 8px 14px; border-radius: 8px; border: 1px solid currentColor;
             background: transparent; color: inherit; cursor: pointer; font: inherit; }
    input { padding: 8px; border-radius: 8px; width: 100%; box-sizing: border-box;
            font: inherit; border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
            background: transparent; color: inherit; margin-bottom: 8px; }
    table { border-collapse: collapse; width: 100%; font-size: 0.85rem; overflow-x: auto; display: block; }
    th, td { border: 1px solid color-mix(in srgb, currentColor 15%, transparent);
             padding: 4px 8px; text-align: left; white-space: nowrap; }
    pre { white-space: pre-wrap; word-break: break-word; margin: 8px 0 0;
          background: color-mix(in srgb, currentColor 8%, transparent); padding: 8px; border-radius: 8px; }
    .err { color: #c0392b; }
  </style>
</head>
<body>
  <h1>Workshop data app</h1>
  <p class="sub">Reads a Lakebase-synced serving table and answers questions through your Genie agent.</p>

  <section>
    <h2>Serving table (Lakebase)</h2>
    <button id="load">Load rows</button>
    <div id="serving"></div>
  </section>

  <section>
    <h2>Ask your Genie agent</h2>
    <input id="q" placeholder="e.g. Which contract had the highest net sales?" />
    <button id="ask">Ask</button>
    <div id="answer"></div>
  </section>

  <script>
    const el = (id) => document.getElementById(id);

    el("load").onclick = async () => {
      const out = el("serving");
      out.textContent = "Loading…";
      try {
        const r = await fetch("/api/serving?limit=25");
        const d = await r.json();
        if (!r.ok) { out.innerHTML = `<p class="err">${d.detail || r.status}</p>`; return; }
        if (!d.rows.length) { out.textContent = "No rows."; return; }
        const cols = Object.keys(d.rows[0].values);
        const head = cols.map((c) => `<th>${c}</th>`).join("");
        const body = d.rows.map((row) =>
          `<tr>${cols.map((c) => `<td>${row.values[c] ?? ""}</td>`).join("")}</tr>`).join("");
        out.innerHTML = `<p>${d.row_count} rows from <code>${d.table}</code></p>` +
          `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
      } catch (e) { out.innerHTML = `<p class="err">${e}</p>`; }
    };

    el("ask").onclick = async () => {
      const out = el("answer");
      const question = el("q").value.trim();
      if (!question) return;
      out.textContent = "Asking…";
      try {
        const r = await fetch("/api/ask", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const d = await r.json();
        if (!r.ok) { out.innerHTML = `<p class="err">${d.detail || r.status}</p>`; return; }
        out.innerHTML = `<p><strong>Status:</strong> ${d.status}</p>` +
          (d.answer ? `<p>${d.answer}</p>` : "") +
          (d.sql ? `<pre>${d.sql}</pre>` : "");
      } catch (e) { out.innerHTML = `<p class="err">${e}</p>`; }
    };
  </script>
</body>
</html>
