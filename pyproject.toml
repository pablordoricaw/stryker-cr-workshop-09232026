[project]
name = "stryker-workshop"
version = "0.1.0"
description = "The Stryker Databricks hands-on workshop: repo skeleton and the workshop.check() validation seam."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

# Participants never install this package: in a Databricks Git folder the repo
# root is already on sys.path, so `import workshop` just works. This project
# config exists only for local development and maintainer CI (running the
# framework tests). Marking the project non-package keeps `uv run` from trying
# to build a wheel.
[tool.uv]
package = false

[dependency-groups]
# pytest for the framework tests; fastapi + httpx let the app/ smoke tests
# (tests/test_app_smoke.py) drive the provided FastAPI app via TestClient.
dev = ["pytest>=8", "fastapi>=0.115", "httpx>=0.27"]

[tool.pytest.ini_options]
# Put the repo root on sys.path so tests import `workshop` without an install,
# mirroring how notebooks import it inside a Databricks Git folder.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
