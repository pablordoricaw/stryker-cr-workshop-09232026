# App bundle — the provided FastAPI data app (wired to Genie + a Lakebase synced table).
#
# ONE of three independently-deployable bundles (see ../README.md for the "why").
# This one owns the product lifecycle: the Databricks App. It changes on the app
# cadence (UI, endpoints) and deploys many times a day, independently of the
# foundation and pipeline. Its blast radius is small — a bad app deploy affects
# only the app, never your schema or your gold data.
#
# Cross-bundle reference by NAME, not coupling: the app reads the gold data the
# PIPELINE built and the Genie agent (06) and Lakebase synced table (07) you
# created out-of-band. None of those is a DAB resource this bundle owns:
#   - Genie agent  -> not a DAB resource type; created via the SDK in 06_genie.
#   - synced table -> created via the CLI/SDK in 07_app (the DAB synced-table
#                     resource is deprecated); the app reaches it through its
#                     `postgres` app resource, added in the Apps UI.
# So the app is wired to those by resource key at deploy time, not by an in-bundle
# handle. Deploy the foundation and pipeline (and create the Genie agent + synced
# table) first — see the runbook in ../README.md.
#
# Namespace-aware: `app_name` defaults to a placeholder; pass your identity-derived
# app name (the value 07_app prints, e.g. stryker-finance-<you>-<digest>) with
# `--var app_name=...` so your app never collides with a teammate's. The `07_app`
# checkpoint asserts THIS exact name.
#
# Deterministic names: no `mode: development` — the app name must match what the
# checkpoint expects, so dev-mode name-prefixing is deliberately avoided.
#
# Validate offline:
#   databricks bundle validate --strict            # from this directory

bundle:
  name: stryker-workshop-app

include:
  - resources/*.yml

variables:
  app_name:
    description: Your per-participant app name (pass --var app_name=stryker-<domain>-<you>).
    default: stryker-finance-app
  app_source_path:
    description: >-
      Workspace path of the app/ directory in your cloned workshop Git folder.
      Absolute workspace path so the bundle deploys the app already synced into
      your workspace rather than a bundled copy.
    default: /Workspace/Users/${workspace.current_user.userName}/stryker-cr-workshop/app

targets:
  dev:
    default: true
  prod: {}
