# The UC Volume where source documents land (bronze source for the doc pipeline).
# schema_name references the schema RESOURCE (not ${var.schema}) so the bundle
# records a volume->schema dependency edge and creates the schema before the
# volume on a clean deploy, instead of racing them.
resources:
  volumes:
    workshop_volume:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.workshop_schema.name}
      name: ${var.volume}
      volume_type: MANAGED
      comment: "Landing volume for source documents (ai_classify -> ai_parse_document -> ai_extract)."
